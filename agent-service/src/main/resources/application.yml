# 独立端口，避免与主后端 8081 冲突；Docker 映射见 docker-compose
server:
  port: 8082

spring:
  application:
    name: hmdp-agent-service
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    # 空串表示无密码；Docker 与主站共用 redis 时需与主配置一致
    password: ${SPRING_REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2

# 编排代理：调用主后端 MQ 补偿等；compose 内为 http://backend:8081
agent:
  backend-base-url: ${AGENT_BACKEND_BASE_URL:http://localhost:8081}
  # 0 表示关闭限流（仅建议压测/排障时）
  rate-limit-per-minute: ${AGENT_RATE_LIMIT:120}
  # 大模型（OpenAI 兼容 /chat/completions）；密钥与模型名务必用环境变量，勿提交仓库
  llm:
    enabled: ${AGENT_LLM_ENABLED:true}
    api-key: ${AGENT_LLM_API_KEY:}
    base-url: ${AGENT_LLM_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    model: ${AGENT_LLM_MODEL:}
    timeout-ms: ${AGENT_LLM_TIMEOUT_MS:90000}
    temperature: ${AGENT_LLM_TEMPERATURE:0.6}

logging:
  level:
    com.hmdp.agent: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
